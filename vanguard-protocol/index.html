<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vanguard Protocol | Arcade Lab</title><style>body{margin:0;background:#0a101c;color:white;font:15px system-ui;text-align:center}header{display:flex;justify-content:space-between;align-items:center;max-width:450px;margin:12px auto}a{color:#9eeeff}button{background:#49cbed;border:0;border-radius:10px;padding:11px 15px;font-weight:900;cursor:pointer}.stage{width:95vw;max-width:450px;aspect-ratio:9/16;position:relative;margin:auto}canvas{width:100%;height:100%;display:block;border:1px solid #385772;border-radius:18px;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-content:center;background:#081222eb;border-radius:18px;padding:20px}.hidden{display:none}h1{font-size:39px;line-height:1.05;color:#73e2ff}p{color:#c6d8e7;line-height:1.6}.hint{font-size:12px}</style></head><body><header><a href="../">← All games</a><b>ARCADE LAB / 02</b><button id="restart">Restart</button></header><div class="stage"><canvas id="game" width="450" height="800" aria-label="Vanguard Protocol playable game"></canvas><div id="overlay" class="overlay"><div><h1 id="headline">VANGUARD<br>PROTOCOL</h1><p id="message">Lead a visible blue squad through zombie swarms. Collect glowing reinforcements and weapon crates, survive and defeat boss enemies. Auto-fire enabled.</p><button id="play">START MISSION</button><p class="hint">Drag / touch / mouse / ← → or A D</p></div></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),o=document.getElementById('overlay'),play=document.getElementById('play');const W=450,H=800,rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let active=false,last=0,t=0,px=225,target=225,units=20,base=100,score=0,level=1,weapon='VULCAN',bullets=[],zombies=[],pickups=[],sparks=[],boss=null,bossNext=320,spawn=0,pickTimer=0,fire=0,keys={};function start(){active=true;last=0;t=0;px=target=225;units=20;base=100;score=0;level=1;weapon='VULCAN';bullets=[];zombies=[];pickups=[];sparks=[];boss=null;bossNext=320;spawn=0;pickTimer=0;fire=0;o.classList.add('hidden');requestAnimationFrame(loop)}function end(){active=false;o.classList.remove('hidden');document.getElementById('headline').textContent='MISSION FAILED';document.getElementById('message').textContent='Score '+score+' • Level '+level+' • Squad '+units+'. Reinforce the squad and hold the base longer!';play.textContent='RETRY'}function fx(x,y,color,count=7){for(let i=0;i<count;i++)sparks.push({x,y,vx:rand(-130,130),vy:rand(-120,100),life:rand(.2,.6),color})}function spawnHorde(){const count=Math.min(22,4+level*2);for(let i=0;i<count;i++)zombies.push({x:rand(76,373),y:-rand(20,260),v:rand(65,100)+level*5,hp:1+Math.floor(level/5),rad:11})}function update(dt){t+=dt;level=1+Math.floor(score/250);if(keys.ArrowLeft||keys.a)target-=290*dt;if(keys.ArrowRight||keys.d)target+=290*dt;target=clamp(target,70,380);px+=(target-px)*Math.min(1,dt*12);spawn-=dt;pickTimer-=dt;fire-=dt;if(spawn<=0){spawnHorde();spawn=Math.max(.5,1.9-level*.1)}if(pickTimer<=0){pickups.push({x:rand(105,345),y:-35,type:Math.random()<.67?'SQUAD':'WEAPON',value:Math.random()<.65?5:10});pickTimer=3.2}if(score>=bossNext&&!boss){const max=100+level*38;boss={x:225,y:-95,hp:max,max,rad:43};bossNext+=600}if(fire<=0){const count=Math.min(12,Math.max(3,Math.ceil(units/5)));for(let i=0;i<count;i++){let spread=(i-(count-1)/2)*Math.min(10,145/count);if(weapon==='SHOTGUN')spread*=1.9;bullets.push({x:px+spread,y:650+rand(-9,9),vx:weapon==='SHOTGUN'?spread*1.25:0,vy:weapon==='SHOTGUN'?-670:-850,damage:weapon==='SHOTGUN'?1.4:1})}fire=weapon==='SHOTGUN'?.34:.115}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt}for(const p of pickups){p.y+=165*dt;if(p.y>615&&p.y<740&&Math.abs(p.x-px)<75){p.dead=true;if(p.type==='SQUAD'){units=Math.min(150,units+p.value);fx(p.x,p.y,'#5ef8d7',18)}else{weapon=weapon==='VULCAN'?'SHOTGUN':'VULCAN';fx(p.x,p.y,'#ffe76b',18)}}if(p.y>785)p.dead=true}for(const z of zombies){z.y+=z.v*dt;if(z.y>715){z.dead=true;base=Math.max(0,base-3);fx(z.x,720,'#f05a54',4)}else if(z.y>635&&Math.abs(z.x-px)<Math.min(72,15+Math.sqrt(units)*7)){z.dead=true;units=Math.max(0,units-1);fx(z.x,z.y,'#ff6255',9)}}if(boss){boss.y=Math.min(230,boss.y+35*dt);boss.x=225+Math.sin(t*.9)*60;if(boss.y>=230&&Math.random()<dt*.45){units=Math.max(0,units-1);base=Math.max(0,base-1)}}for(const b of bullets){if(b.dead)continue;for(const z of zombies){if(z.dead)continue;if(Math.abs(b.x-z.x)<z.rad+3&&Math.abs(b.y-z.y)<z.rad+10){b.dead=true;z.hp-=b.damage;if(z.hp<=0){z.dead=true;score+=5;fx(z.x,z.y,'#ffa866',5)}break}}if(boss&&!b.dead&&Math.abs(b.x-boss.x)<boss.rad&&Math.abs(b.y-boss.y)<boss.rad){b.dead=true;boss.hp-=b.damage;fx(b.x,b.y,'#ffd279',2);if(boss.hp<=0){score+=150;units=Math.min(150,units+10);fx(boss.x,boss.y,'#ffcd64',35);boss=null}}}bullets=bullets.filter(b=>!b.dead&&b.y>-30&&b.x>-30&&b.x<480);zombies=zombies.filter(z=>!z.dead);pickups=pickups.filter(p=>!p.dead);for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}sparks=sparks.filter(p=>p.life>0);if(base<=0||units<=0)end()}function unit(x,y,scale=1){g.save();g.translate(x,y);g.scale(scale,scale);g.fillStyle='#0b1c31';g.fillRect(-7,0,14,14);g.fillStyle='#247be1';g.fillRect(-6,-12,12,15);g.fillStyle='#c4f9ff';g.beginPath();g.arc(0,-15,6,0,7);g.fill();g.fillStyle='#223344';g.fillRect(3,-20,4,16);g.restore()}function zombie(x,y,s=1,big=false){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=big?'#8c433b':'#525b4e';g.fillRect(-8,-7,16,22);g.fillStyle=big?'#e78a6d':'#a0ae95';g.beginPath();g.arc(0,-11,8,0,7);g.fill();g.fillStyle='#ff4545';g.fillRect(-5,-12,3,3);g.fillRect(3,-12,3,3);g.restore()}function draw(){let bg=g.createLinearGradient(0,0,450,800);bg.addColorStop(0,'#152944');bg.addColorStop(1,'#182333');g.fillStyle=bg;g.fillRect(0,0,W,H);g.fillStyle='#172536';g.beginPath();g.moveTo(68,0);g.lineTo(380,0);g.lineTo(449,800);g.lineTo(0,800);g.fill();g.fillStyle='#63778b';g.beginPath();g.moveTo(88,0);g.lineTo(365,0);g.lineTo(425,800);g.lineTo(25,800);g.fill();g.strokeStyle='#c8dcf333';g.lineWidth=2;for(let i=0;i<18;i++){let y=(i*58+t*140)%870-35;g.beginPath();g.moveTo(225-(25+y*.13),y);g.lineTo(225+(25+y*.13),y);g.stroke()}for(const p of pickups){g.shadowBlur=17;g.shadowColor=p.type==='SQUAD'?'#00f5d7':'#ffe87a';g.fillStyle=p.type==='SQUAD'?'#0b9e8b':'#b47920';g.fillRect(p.x-31,p.y-24,62,46);g.strokeStyle='#e6ffff';g.strokeRect(p.x-31,p.y-24,62,46);g.shadowBlur=0;g.fillStyle='white';g.textAlign='center';g.font='bold 16px system-ui';g.fillText(p.type==='SQUAD'?'+'+p.value:'WEAPON',p.x,p.y+5)}for(const z of zombies)zombie(z.x,z.y);if(boss){zombie(boss.x,boss.y,3.8,true);g.fillStyle='#3b1620';g.fillRect(boss.x-68,boss.y-79,136,10);g.fillStyle='#f35b51';g.fillRect(boss.x-68,boss.y-79,136*Math.max(0,boss.hp/boss.max),10)}let cols=Math.ceil(Math.sqrt(Math.min(units,121)));for(let i=0;i<Math.min(units,121);i++){const row=Math.floor(i/cols),col=i%cols;unit(px+(col-(cols-1)/2)*12,659+row*13,.8)}g.shadowColor='#ffec8c';g.shadowBlur=12;g.strokeStyle=weapon==='SHOTGUN'?'#ff8f3a':'#ffe18d';g.lineWidth=3;for(const b of bullets){g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x-b.vx*.02,b.y+18);g.stroke()}g.shadowBlur=0;for(const p of sparks){g.globalAlpha=Math.max(0,Math.min(1,p.life*2));g.fillStyle=p.color;g.fillRect(p.x,p.y,4,4)}g.globalAlpha=1;g.fillStyle='#071326e8';g.fillRect(0,0,450,113);g.textAlign='left';g.fillStyle='#e9faff';g.font='900 21px system-ui';g.fillText('VANGUARD PROTOCOL',16,36);g.font='bold 14px system-ui';g.fillText('SQUAD '+units,17,65);g.fillText('LEVEL '+level,166,65);g.fillText('SCORE '+score,293,65);g.fillStyle='#162038';g.fillRect(17,81,416,12);g.fillStyle=base>35?'#63e9ff':'#ff5e68';g.fillRect(17,81,416*base/100,12);g.fillStyle='white';g.font='bold 12px system-ui';g.fillText('BASE '+base+'%',18,108);g.fillText('AUTO FIRE · '+weapon,18,771)}function loop(ms){if(!active)return;const dt=Math.min((ms-last||16)/1000,.033);last=ms;update(dt);draw();if(active)requestAnimationFrame(loop)}function point(e){const r=c.getBoundingClientRect();target=(e.clientX-r.left)*W/r.width}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);point(e)});c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)point(e)});window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);play.onclick=start;document.getElementById('restart').onclick=start;draw()})();
</script></body></html>
