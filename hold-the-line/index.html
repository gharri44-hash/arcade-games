<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hold the Line | Arcade Lab</title><style>body{margin:0;background:#090d16;color:#eff5ff;font:15px system-ui;text-align:center}header{display:flex;align-items:center;justify-content:space-between;max-width:450px;margin:12px auto;gap:6px}a{color:#aee7fa}button{background:#ff983d;color:#211009;border:0;border-radius:9px;padding:11px 15px;font-weight:900;cursor:pointer}.stage{position:relative;max-width:450px;width:95vw;aspect-ratio:9/16;margin:auto}canvas{display:block;width:100%;height:100%;border-radius:18px;border:1px solid #6e493c;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0b1021ed;border-radius:18px}.overlay.hidden{display:none}.panel{padding:30px}h1{font-size:42px;line-height:1.02;letter-spacing:-1px;color:#ffa248}p{line-height:1.6;color:#cad5e8}.hint{font-size:12px}</style></head><body><header><a href="../">← All games</a><strong>ARCADE LAB / 01</strong><button id="restart">Restart</button></header><div class="stage"><canvas id="game" width="450" height="800" aria-label="Hold the Line playable game"></canvas><div class="overlay" id="overlay"><div class="panel"><h1 id="headline">HOLD<br>THE LINE</h1><p id="message">Command a glowing defense squad. Break approaching formations before they breach the base. Defend through escalating waves.</p><button id="play">START DEFENSE</button><p class="hint">Drag, move mouse or use ← → / A D · Auto-fire</p></div></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),overlay=document.getElementById('overlay'),play=document.getElementById('play');const W=450,H=800,rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));let live=false,prev=0,t=0,score=0,wave=1,hp=100,player=225,aim=225,spawn=0,fire=0,bullets=[],foes=[],sparks=[],keys={};function reset(){live=true;prev=0;t=score=0;wave=1;hp=100;player=aim=225;spawn=fire=0;bullets=[];foes=[];sparks=[];overlay.classList.add('hidden');requestAnimationFrame(tick)}function lose(){live=false;overlay.classList.remove('hidden');document.getElementById('headline').textContent='BASE LOST';document.getElementById('message').textContent='Score: '+score+' • Reached wave '+wave+'. Try to hold your line longer!';play.textContent='RETRY'}function burst(x,y,color,n=8){for(let j=0;j<n;j++)sparks.push({x,y,vx:rand(-110,110),vy:rand(-95,105),life:rand(.18,.55),color})}function formation(){const rows=Math.min(9,4+Math.ceil(wave/2));for(let r=0;r<rows;r++)for(let col=0;col<9;col++){if(Math.random()<.1)continue;foes.push({x:27+col*49+rand(-5,5),y:-25-r*44-rand(0,20),hp:1+Math.floor(wave/4),speed:35+wave*6+rand(-4,6),rad:11+Math.min(6,wave),phase:rand(0,6)})}}function update(dt){t+=dt;if(keys.ArrowLeft||keys.a)aim-=320*dt;if(keys.ArrowRight||keys.d)aim+=320*dt;aim=clamp(aim,40,410);player+=(aim-player)*Math.min(1,dt*12);spawn-=dt;fire-=dt;if(spawn<=0){formation();spawn=Math.max(2.2,5-wave*.16)}if(fire<=0){for(const d of [-26,-13,0,13,26])bullets.push({x:player+d,y:678});fire=.14}for(const b of bullets)b.y-=720*dt;for(const e of foes){e.y+=e.speed*dt;e.x+=Math.sin(t*2+e.phase)*.18;if(e.y>725){hp-=3;e.dead=true;burst(e.x,723,'#ff9a35',5)}}for(const b of bullets){if(b.dead)continue;for(const e of foes){if(e.dead)continue;if(Math.abs(e.x-b.x)<e.rad&&Math.abs(e.y-b.y)<e.rad+9){b.dead=true;e.hp--;if(e.hp<=0){e.dead=true;score+=10;burst(e.x,e.y,'#ffa335');wave=1+Math.floor(score/400)}break}}}bullets=bullets.filter(b=>!b.dead&&b.y>-20);foes=foes.filter(e=>!e.dead);for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt}sparks=sparks.filter(s=>s.life>0);if(hp<=0){hp=0;lose()}}function draw(){const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a1224');bg.addColorStop(.54,'#311e23');bg.addColorStop(1,'#ab481d');g.fillStyle=bg;g.fillRect(0,0,W,H);g.strokeStyle='#fca65b15';for(let i=0;i<12;i++){g.beginPath();g.moveTo(i*48,105);g.lineTo(i*48-95,720);g.stroke()}for(let i=0;i<45;i++){g.fillStyle='#ffb26855';g.fillRect((i*71)%W,(i*133+t*21)%H,2,2)}g.fillStyle='#0b1522';g.fillRect(0,725,W,75);g.fillStyle='#ff9f45';g.fillRect(0,722,W,3);for(const e of foes){g.save();g.translate(e.x,e.y);g.shadowColor='#ff8b29';g.shadowBlur=13;g.fillStyle='#f48629';g.strokeStyle='#ffd27e';g.lineWidth=1.5;g.beginPath();g.moveTo(0,e.rad);g.lineTo(-e.rad,-e.rad);g.lineTo(e.rad,-e.rad);g.closePath();g.fill();g.stroke();g.restore()}g.strokeStyle='#8cf8ff';g.shadowColor='#61eeff';g.shadowBlur=13;g.lineWidth=3;for(const b of bullets){g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x,b.y+22);g.stroke()}for(let k=0;k<15;k++){const sx=player+(k%5-2)*14,sy=674+Math.floor(k/5)*13;g.fillStyle='#1766a9';g.fillRect(sx-5,sy-3,10,12);g.fillStyle='#9df4ff';g.beginPath();g.arc(sx,sy-6,5,0,Math.PI*2);g.fill()}g.shadowBlur=0;for(const s of sparks){g.globalAlpha=Math.max(0,Math.min(1,s.life*2));g.fillStyle=s.color;g.fillRect(s.x,s.y,4,4)}g.globalAlpha=1;g.fillStyle='#080f1dcc';g.fillRect(0,0,W,119);g.fillStyle='white';g.font='900 23px system-ui';g.fillText('HOLD THE LINE',15,37);g.font='bold 14px system-ui';g.fillText('WAVE '+wave,16,67);g.fillText('SCORE '+score,310,67);g.fillStyle='#43212b';g.fillRect(15,83,420,12);g.fillStyle=hp>35?'#ffa43d':'#fb4b52';g.fillRect(15,83,420*hp/100,12);g.font='bold 12px system-ui';g.fillStyle='white';g.fillText('BASE '+hp+'%',16,111)}function tick(ms){if(!live)return;const dt=Math.min((ms-prev||16)/1000,.033);prev=ms;update(dt);draw();if(live)requestAnimationFrame(tick)}function point(e){const r=c.getBoundingClientRect();aim=(e.clientX-r.left)*W/r.width}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);point(e)});c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)point(e)});window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);play.onclick=reset;document.getElementById('restart').onclick=reset;draw()})();
</script></body></html>
